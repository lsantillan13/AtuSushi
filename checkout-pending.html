<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0A0A0A"><link rel="icon" type="image/svg+xml" href="atu-favicon.svg"><title>ATU Sushi | Pago pendiente</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--black:#0a0a0a;--black-2:#141414;--bone:#f4f0e8;--gray:#9b9b9b;--gold:#c99a43;--line:rgba(244,240,232,.16);--display:"Anton",Impact,sans-serif;--sans:"Inter",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--black);color:var(--bone);font-family:var(--sans);display:grid;place-items:center;padding:24px}.result{width:min(620px,100%);padding:clamp(28px,6vw,64px);border:1px solid var(--line);background:var(--black-2);text-align:center}.brand{font:32px var(--display)}.eyebrow{margin:34px 0 12px;color:var(--gold);font-size:10px;font-weight:700;letter-spacing:.24em}.mark{width:58px;height:58px;margin:0 auto;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font:30px var(--display)}h1{margin:0;font:clamp(42px,8vw,72px)/.9 var(--display)}p{color:var(--gray);line-height:1.6}.order{margin:24px 0;padding:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;font-size:13px}.actions{display:flex;gap:10px;margin-top:24px}.button{flex:1;min-height:48px;display:grid;place-items:center;border:1px solid var(--line);color:var(--bone);text-decoration:none;font-size:10px;font-weight:700;letter-spacing:.12em}.button.primary{background:var(--gold);border-color:var(--gold);color:var(--black)}@media(max-width:520px){.actions{display:grid;grid-template-columns:1fr}}</style></head><body><main class="result"><div class="brand">ATU</div><div class="eyebrow">MERCADOPAGO · PAGO PENDIENTE</div><div class="mark">…</div><h1>ESTAMOS<br>ESPERANDO.</h1><p>MercadoPago todavía no confirmó la operación. Guardamos tu pedido para poder retomarlo.</p><div class="order" id="orderSummary">Pedido pendiente de confirmación.</div><div class="actions"><a class="button" href="index.html">VOLVER A ATU</a><a class="button primary" href="Menu-Paso-A-Paso.html">REVISAR PEDIDO</a></div></main><script>const order=JSON.parse(localStorage.getItem('atu_last_order')||'null');if(order){document.getElementById('orderSummary').textContent=`Pedido ${order.id||''} · Total ${new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(order.total||0)}`;localStorage.setItem('atu_payment_status','pending')}</script></body></html>

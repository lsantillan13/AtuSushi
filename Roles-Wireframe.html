  <script>(function(){function m(a){var h=a.getAttribute("href");if(!h)return;try{var u=new URL(h,document.baseURI);if((u.protocol==="http:"||u.protocol==="https:")&&u.host!==location.host){a.target="_blank";a.rel="noopener noreferrer";}}catch(e){}}function s(){document.querySelectorAll("a[href]").forEach(m);}if(document.readyState!=="loading"){s();}else{document.addEventListener("DOMContentLoaded",s);}document.addEventListener("click",function(e){var a=e.target&&e.target.closest&&e.target.closest("a[href]");if(a){m(a);}},true);})();</script>
  
<script>
/* Demo bridge: replace these localStorage reads/writes with API calls when the backend exists. */
(function(){
  const KEYS={cart:'atu_cart_v1',orders:'atu_orders_v2',tables:'atu_tables_v1',paused:'atu_paused_products',custom:'atu_menu_custom'};
  const read=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key)||fallback)}catch{return JSON.parse(fallback)}};
  const write=(key,value)=>localStorage.setItem(key,JSON.stringify(value));
  const text=element=>(element?.innerText||element?.textContent||'').replace(/\s+/g,' ').trim();
  const toast=document.createElement('div');
  toast.style.cssText='position:fixed;right:20px;bottom:20px;z-index:9999;max-width:360px;padding:14px 16px;background:#141414;color:#F4F0E8;border:1px solid #C99A43;box-shadow:0 14px 36px #0009;font:12px/1.45 Inter,Arial,sans-serif;opacity:0;transform:translateY(12px);transition:.25s;pointer-events:none';
  document.body.appendChild(toast);
  let timer;
  const notify=message=>{toast.textContent=message;toast.style.opacity='1';toast.style.transform='none';clearTimeout(timer);timer=setTimeout(()=>{toast.style.opacity='0';toast.style.transform='translateY(12px)'},2800)};
  const ensureOrders=()=>{const orders=read(KEYS.orders,'[]');if(orders.length)return orders;const demo=[{id:'#ATU-2847',customer:{name:'Lucía M.'},items:[{name:'New York Phila',quantity:2}],status:'en_preparacion',fulfillment:'delivery',total:57800,createdAt:new Date().toISOString()},{id:'#ATU-2848',customer:{name:'Sofía R.'},items:[{name:'Supernova',quantity:1}],status:'confirmado',fulfillment:'pickup',total:44500,createdAt:new Date().toISOString()}];write(KEYS.orders,demo);return demo};
  const updateOrder=(id,status)=>{const orders=ensureOrders();const normalized=id.replace(/^#ATU-/,'#');let order=orders.find(item=>item.id===id||item.id===`#ATU-${normalized.replace(/^#/,'')}`);if(!order){order={id:`#ATU-WIRE-${normalized.replace(/^#/,'')}`,customer:{name:'Cliente wireframe'},items:[],status:'pendiente',fulfillment:'delivery',total:0,createdAt:new Date().toISOString(),timeline:[]};orders.unshift(order)}order.status=status;order.timeline=order.timeline||[];order.timeline.push({status,at:new Date().toISOString()});write(KEYS.orders,orders);notify(`${order.id} actualizado a ${status}.`)};
  const productNameFromTarget=target=>{const card=target.closest('[class*="rounded-"]')||target.parentElement?.parentElement;return text(card).split('•')[0].slice(0,80)};
  const orderIdFromTarget=target=>{let node=target;for(let depth=0;node&&depth<7;depth++,node=node.parentElement){const match=text(node).match(/#\d{3,}/);if(match)return match[0]}return '#ATU-DEMO'};
  const handleClick=event=>{
    const target=event.target.closest('button');
    if(!target)return;
    const label=text(target).toUpperCase();
    if(label==='REPARTO'||label.includes('REPARTO')){event.preventDefault();event.stopPropagation();notify('Reparto queda fuera del alcance de esta demo.');return;}
    if(label.includes('LISTO')||label==='CONFIRMAR PEDIDO'){
      const container=target.closest('[class*="rounded-"]');
      const id=orderIdFromTarget(target);
      updateOrder(id,label.includes('LISTO')?'listo':'confirmado');return;
    }
    if(label.includes('ENTREGADO')){const id=orderIdFromTarget(target);updateOrder(id,'entregado');return;}
    if(label.includes('PAUSAR')||label.includes('ACTIVAR')||label.includes('REACTIVAR')){
      const name=productNameFromTarget(target);let paused=read(KEYS.paused,'[]');const id=name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');if(paused.includes(id))paused=paused.filter(item=>item!==id);else paused.push(id);write(KEYS.paused,paused);notify(`${name} ${paused.includes(id)?'pausado':'reactivado'} en la demo.`);return;
    }
    if(label.includes('NUEVO PLATO')||label.includes('NUEVO ROLL')){
      const id=`demo-roll-${Date.now()}`;const custom=read(KEYS.custom,'[]');custom.push({id,name:'Demo Roll',category:'ROLLS',sub:'CLASICOS',ingredients:['Salmón','Palta'],variants:[{id:`${id}-8p`,label:'8P',price:29900}],price:29900});write(KEYS.custom,custom);notify('Demo Roll creado. Disponible al recargar el menú.');return;
    }
    if(label.includes('VER SITIO'))return;
  };
  document.addEventListener('click',handleClick,true);
  window.addEventListener('storage',event=>{if(Object.values(KEYS).includes(event.key))notify('Contexto actualizado desde otra pestaña.')});
  window.ATUDemoBridge={read,write,notify,keys:KEYS};
})();
</script>
